<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roam — Create account</title>
    <style>
      :root{--purple:#7846d6;--purple-dark:#6033b4;--ink:#211b2d;--muted:#80778e;--line:#e8dff1}
      *{box-sizing:border-box}body{margin:0;color:var(--ink);background:#faf8fe;font:14px/1.6 Inter,Arial,sans-serif}a{color:var(--purple);text-decoration:none}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--purple);outline-offset:4px}.signup-page{min-height:100vh;display:grid;place-items:center;padding:32px;background:radial-gradient(ellipse at 20% 10%,#eee2fc,transparent 55%),#fcfbfe}.signup-card{width:100%;max-width:430px;padding:42px;border:1px solid #eee6f6;border-radius:24px;background:#fff;box-shadow:0 24px 70px #59348612}.logo{display:inline-flex;align-items:center;gap:9px;color:var(--ink);font-size:27px;font-weight:800;letter-spacing:-1.5px}.logo-mark{width:33px;height:33px;display:grid;place-items:center;border-radius:11px;background:var(--purple);color:#fff;font-size:24px}.signup-card h1{margin:34px 0 8px;font-size:34px;letter-spacing:-1.5px}.subtitle{margin:0 0 28px;color:var(--muted);font-size:13px}.field{display:grid;gap:7px;margin-bottom:16px}.field label{font-size:11px;font-weight:600}.field input{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit}.field input:focus{border-color:var(--purple);outline:0;box-shadow:0 0 0 3px #7846d620}.help,.errorlist{margin:5px 0 0;color:var(--muted);font-size:11px}.errorlist{padding:0;color:#b84157;list-style:none}.submit-button{width:100%;min-height:50px;margin-top:12px;border:0;border-radius:11px;background:var(--purple);color:#fff;font-weight:600;cursor:pointer}.submit-button:hover{background:var(--purple-dark)}.back-link{display:block;margin-top:22px;text-align:center;font-size:11px}
      @media(max-width:500px){.signup-page{padding:18px}.signup-card{padding:30px 24px}}
    </style>
  </head>
  <body>
    <main class="signup-page">
      <section class="signup-card" aria-labelledby="signup-title">
        <a class="logo" href="{% url 'landing' %}"><span class="logo-mark">◎</span>roam.</a>
        <h1 id="signup-title">Create your account.</h1>
        <p class="subtitle">Start keeping the places, people, and moments that matter to you.</p>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="field">
              {{ field.label_tag }}
              {{ field }}
              {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
              {{ field.errors }}
            </div>
          {% endfor %}
          <button class="submit-button" type="submit">Create account <span>→</span></button>
        </form>
        <a class="back-link" href="{% url 'login' %}">Already have an account? Log in →</a>
      </section>
    </main>
  </body>
</html>
